name: Sync Content (Securing Quest + Webmentions + Mastodon + YouTube)

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: sync-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: src
        run: bun install --frozen-lockfile

      - name: Run sync script
        id: sync_str
        continue-on-error: true
        working-directory: src
        run: bun run sync:str

      - name: Sync webmentions
        id: sync_webmentions
        continue-on-error: true
        working-directory: src
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: bun run sync:webmentions

      - name: Sync Mastodon toots
        id: sync_mastodon
        continue-on-error: true
        working-directory: src
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: bun run sync:mastodon

      - name: Sync YouTube talks
        id: sync_youtube
        continue-on-error: true
        working-directory: src
        run: bun run sync:youtube

      - name: Check for changes
        id: changes
        env:
          SECURING_QUEST: ${{ steps.sync_str.outcome }}
          WEBMENTIONS: ${{ steps.sync_webmentions.outcome }}
          MASTODON: ${{ steps.sync_mastodon.outcome }}
          YOUTUBE: ${{ steps.sync_youtube.outcome }}
        run: |
          stage_source() {
            local outcome="$1" source="$2"
            shift 2
            if [ "$outcome" = "success" ]; then
              git add -A -- "$@"
            else
              echo "::warning::Skipping $source output ($outcome)"
              echo "- $source: $outcome" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "## Content sync" >> "$GITHUB_STEP_SUMMARY"
          stage_source "$SECURING_QUEST" "Securing Quest" 'src/src/content/blog/str-*'
          stage_source "$WEBMENTIONS" "Webmentions" src/src/data/webmentions.json
          stage_source "$MASTODON" "Mastodon" src/src/content/note/ src/public/images/mastodon/ src/src/data/mastodon-sync-state.json
          stage_source "$YOUTUBE" "YouTube" 'src/src/content/speaking/yt-*'
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync content (securing.quest + webmentions + mastodon + youtube)"
          git push

    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}

  deploy:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    uses: ./.github/workflows/swa-deploy.yml
    secrets: inherit
